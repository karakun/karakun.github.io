<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 376" width="100%" role="img"
     aria-labelledby="scr-title scr-desc" font-family="'Open Sans','Segoe UI',Helvetica,Arial,sans-serif">
  <title id="scr-title">Reverting the same commit in a full clone and in a shallow clone</title>
  <desc id="scr-desc">Each commit is a snapshot. In a full clone, with a parent to compare, git revert
  --no-commit HEAD undoes only HEAD's edit and one file changes back. In a shallow clone the parent was never
  fetched, so HEAD is the only snapshot and the same command undoes the whole repository, staging every file
  for deletion.</desc>

  <rect x="0" y="0" width="400" height="376" fill="#ffffff"/>

  <!-- full clone -->
  <rect x="2" y="8" width="195" height="358" rx="7" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="18" y="32" font-size="12.2" font-weight="700" fill="#1f2328">Full clone</text>
  <line x1="54" y1="80" x2="87" y2="80" stroke="#8c959f" stroke-width="1.8"/>
  <line x1="111" y1="80" x2="144" y2="80" stroke="#8c959f" stroke-width="1.8"/>
  <circle cx="42" cy="80" r="12" fill="#ffffff" stroke="#8c959f" stroke-width="1.8" stroke-dasharray="3 3"/>
  <text x="42" y="84" font-size="11.2" fill="#57606a" text-anchor="middle">…</text>
  <circle cx="99" cy="80" r="12" fill="#ffffff" stroke="#57606a" stroke-width="1.8"/>
  <circle cx="156" cy="80" r="12" fill="#1f2328"/>
  <text x="99" y="108" font-size="11.2" fill="#57606a" text-anchor="middle">parent</text>
  <text x="156" y="108" font-size="11.2" font-weight="700" fill="#1f2328" text-anchor="middle">HEAD</text>
  <text x="156" y="124" font-size="11.2" fill="#57606a" text-anchor="middle">bad YAML</text>

  <rect x="12" y="146" width="175" height="32" rx="5" fill="#ffffff" stroke="#d0d7de"/>
  <text x="99" y="166" font-size="10" fill="#1f2328" text-anchor="middle" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace">git revert --no-commit HEAD</text>

  <path d="M99 184 L99 200" stroke="#8c959f" stroke-width="1.8"/>
  <path d="M94 195 L99 201 L104 195" fill="none" stroke="#8c959f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="12" y="210" width="175" height="142" rx="5" fill="#ffffff" stroke="#216e39" stroke-width="1.5"/>
  <text x="24" y="232" font-size="11.2" fill="#1f2328">Each commit is a snapshot,</text>
  <text x="24" y="248" font-size="11.2" fill="#1f2328">so with a parent, only</text>
  <text x="24" y="264" font-size="11.2" fill="#1f2328">HEAD's edit gets undone.</text>
  <circle cx="30" cy="284" r="10" fill="#216e39"/>
  <path d="M25 284 L28.5 287.5 L35 280" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="46" y="288" font-size="12.2" font-weight="700" fill="#216e39">1 file changed back</text>
  <text x="46" y="310" font-size="11.2" fill="#57606a">just the broken YAML,</text>
  <text x="46" y="326" font-size="11.2" fill="#57606a">which is exactly what</text>
  <text x="46" y="342" font-size="11.2" fill="#57606a">you wanted undone</text>

  <!-- shallow clone -->
  <rect x="203" y="8" width="195" height="358" rx="7" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="219" y="32" font-size="12.2" font-weight="700" fill="#1f2328">Shallow clone</text>
  <text x="312" y="32" font-size="11.2" fill="#57606a" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace">--depth 1</text>
  <line x1="255" y1="80" x2="288" y2="80" stroke="#c9ccd1" stroke-width="1.8" stroke-dasharray="4 4"/>
  <line x1="312" y1="80" x2="345" y2="80" stroke="#c9ccd1" stroke-width="1.8" stroke-dasharray="4 4"/>
  <circle cx="243" cy="80" r="12" fill="#ffffff" stroke="#c9ccd1" stroke-width="1.8" stroke-dasharray="3 3"/>
  <circle cx="300" cy="80" r="12" fill="#ffffff" stroke="#c9ccd1" stroke-width="1.8" stroke-dasharray="3 3"/>
  <text x="271" y="108" font-size="11.2" fill="#57606a" text-anchor="middle">never fetched</text>
  <circle cx="357" cy="80" r="12" fill="#1f2328"/>
  <text x="357" y="108" font-size="11.2" font-weight="700" fill="#1f2328" text-anchor="middle">HEAD</text>
  <text x="357" y="124" font-size="11.2" fill="#57606a" text-anchor="middle">bad YAML</text>

  <rect x="213" y="146" width="175" height="32" rx="5" fill="#ffffff" stroke="#d0d7de"/>
  <text x="300" y="166" font-size="10" fill="#1f2328" text-anchor="middle" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace">git revert --no-commit HEAD</text>

  <path d="M300 184 L300 200" stroke="#8c959f" stroke-width="1.8"/>
  <path d="M295 195 L300 201 L305 195" fill="none" stroke="#8c959f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="213" y="210" width="175" height="142" rx="5" fill="#ffffff" stroke="#b42318" stroke-width="1.5"/>
  <text x="225" y="232" font-size="11.2" fill="#1f2328">With no parent, HEAD is the</text>
  <text x="225" y="248" font-size="11.2" fill="#1f2328">only snapshot, so the whole</text>
  <text x="225" y="264" font-size="11.2" fill="#1f2328">repository gets undone.</text>
  <circle cx="231" cy="292" r="10" fill="#b42318"/>
  <path d="M227 288 L235 296 M235 288 L227 296" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <text x="247" y="288" font-size="12.2" font-weight="700" fill="#b42318">Every file staged</text>
  <text x="247" y="304" font-size="12.2" font-weight="700" fill="#b42318">for deletion</text>
  <text x="247" y="326" font-size="11.2" fill="#57606a">151 files in one repo,</text>
  <text x="247" y="342" font-size="11.2" fill="#57606a">723 in the other</text>
</svg>
