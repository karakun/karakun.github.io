# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Builds the Jekyll site and deploys it via rsync/SSH to the cyon webspace
name: Build and deploy Jekyll site

on:
  # Runs on pushes to all branches
  push:

  # Runs daily
  schedule:
    - cron: '30 6 * * *'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "deploy-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Ruby
        # https://github.com/ruby/setup-ruby/releases/tag/v1.329.0
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a
        with:
          ruby-version: '3.4' # Not needed with a .ruby-version file
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          cache-version: 1 # Increment this number if you need to re-download cached gems
      - name: Build with Jekyll
        # Outputs to the './_site' directory by default
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Run PageFind indexing
        run: npx -y pagefind --site _site
      - name: Upload site
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: _site/
          include-hidden-files: true # keep .htaccess
          retention-days: 1
  # Deploy job: only on master, so the "Actions" environment can stay limited to master
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: build
    # Deploy secrets (DEPLOY_SSH_KEY, ...) and DEPLOY_TARGET live in this environment
    environment: Actions
    steps:
      - name: Download site
        uses: actions/download-artifact@v8
        with:
          name: site
          path: _site
      - name: Deploy via rsync
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KEY_PASSPHRASE: ${{ secrets.DEPLOY_SSH_KEY_PASSPHRASE }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_TARGET: ${{ vars.DEPLOY_TARGET }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          # Hand the passphrase to ssh-add without a terminal prompt
          printf '#!/bin/sh\nprintf "%%s\\n" "$SSH_KEY_PASSPHRASE"\n' > ~/.ssh/askpass
          chmod 700 ~/.ssh/askpass
          SSH_ASKPASS=~/.ssh/askpass SSH_ASKPASS_REQUIRE=force ssh-add ~/.ssh/deploy_key < /dev/null
          # Key now lives only in the agent's memory
          rm -f ~/.ssh/askpass ~/.ssh/deploy_key
          # Trailing slash on _site/ syncs the folder's contents, not the folder itself
          rsync -rltvz --delete --no-perms --no-owner --no-group \
            -e "ssh -o StrictHostKeyChecking=yes" \
            _site/ "$DEPLOY_TARGET"
          ssh-agent -k
      - name: Remove SSH key files
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/askpass
  notify-indexnow:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Download site
        uses: actions/download-artifact@v8
        with:
          name: site
          path: _site
      - name: Setup JBang
        uses: jbangdev/setup-jbang@v0.1.1
      - name: Notify Bing via IndexNow
        run: jbang scripts/SubmitIndexNow.java
        env:
          SITE_URL: https://karakun.dev
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
